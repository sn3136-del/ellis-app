<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- blob: is the in-app document preview only: bytes come from the
         authenticated backend (connect-src) and render from a local blob URL.
         frame-src blob: is the local PDF viewer; no third-party page is ever
         framed. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000; frame-src 'self' blob:" />
    <title>Ellis for Trip.com</title>
    <link href="/fonts/fonts.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
