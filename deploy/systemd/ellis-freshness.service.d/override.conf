[Service]
# The application stops dispatch at five hours and drains bounded workers.
# Install this as /etc/systemd/system/ellis-freshness.service.d/override.conf
# so existing hosts with a shorter service timeout use the same run budget.
TimeoutStartSec=18300
TimeoutStopSec=90
KillSignal=SIGTERM
Environment=ELLIS_KIMI_CONCURRENCY=4
